# Auto pre-render pipeline for La Villa Coliving
#
# Triggers:
# 1. Push to main (src/ or public/ changes only — NOT prerendered files)
# 2. repository_dispatch from n8n (after blog approval) — immediate
# 3. Daily schedule 5h UTC — safety net + blog sync + fraîcheur de la dispo prérendue
# 4. Manual from GitHub UI — troubleshooting
#
# What it does:
# - Fetches published blog slugs from Supabase
# - Updates vercel.json with blog rewrites
# - Generates sitemap.xml with all routes + hreflang
# - Pre-renders all pages (static + blog) with Puppeteer
# - Commits and pushes changes → triggers Vercel auto-deploy
#
# Loop prevention: pushes from github-actions[bot] don't trigger new workflows.
# Extra safety: paths-ignore excludes prerendered files and sitemap.
#
# Déploiement production (B4, 02/09/2026) : vercel.json "ignoreCommand" ignore le build du
# push source (le bot déploie 10-15 min plus tard, bundle + HTML cohérents). Si le prérendu
# n'a pas changé après un push, le bot pousse un commit vide pour déclencher ce déploiement.
# Les deux gardes (pages maisons, hydratation) bloquent la publication ET le déploiement en
# cas d'échec.
#
# Cost: $0 (GitHub Actions free for public repos, 2000 min/month for private)

name: Pre-render & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'vercel.json'
  repository_dispatch:
    types: [prerender]
  schedule:
    - cron: '0 5 * * *'
    # (Lot 3 SEO funnel — Q2, 03/09/2026) 2ᵉ passage : écart HTML/réalité de la dispo ramené à 12 h.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Un seul run prerender a la fois - le plus recent annule l ancien (fix course-au-push)
concurrency:
  group: prerender
  cancel-in-progress: true

jobs:
  prerender:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 04/09/2026 : run de 15 min annulé par le timeout (npm install 7 min + prérendu) — marge doublée
    # Skip if the push was made by github-actions[bot] (loop prevention)
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npx tsc -b && npx vite build

      - name: Pre-render all pages (Supabase sync + Puppeteer)
        run: node scripts/prerender.mjs

      # Garde Lot C0 (brief « Conquête IA », 09/2026) : redirections sans chaîne, aucune URL du
      # sitemap redirigée, paires de consolidation attendues (scripts/redirects.expected.json).
      - name: Vérifier les redirections
        run: node scripts/check-redirects.mjs --expect scripts/redirects.expected.json

      # Garde Lot C0 : aucun concurrent nommé dans le HTML prérendu ni dans llms.txt (CLAUDE.md §1).
      # La liste des noms vit dans le secret COMPETITOR_NAMES (jamais dans le repo) ; sans secret,
      # la garde avertit sans bloquer (voir scripts/check-no-competitor.mjs).
      - name: Vérifier l'absence de concurrents nommés
        run: node scripts/check-no-competitor.mjs
        env:
          COMPETITOR_NAMES: ${{ secrets.COMPETITOR_NAMES }}

      # Garde Lot A (02/09/2026) : chaque maison de v_public_rooms a sa page FR+EN complète
      # (embed chambres, CTA contextuels, prix FR, marqueurs d'hydratation). Échec = pas de commit.
      - name: Vérifier les pages maisons
        run: node scripts/house-pages-check.mjs

      # Garde Lot S1 (brief Socle entité, 05/09/2026) : fiche de faits canonique = base = HTML prérendu
      # = llms.txt (bloc présent une fois sur 14 pages money + 8 articles FR/EN, aucune chaîne périmée,
      # JSON-LD sans doublon ni aggregateRating). Échec = pas de commit.
      - name: Vérifier la fiche entité
        run: node scripts/check-entity-facts.mjs

      # Garde Lot B (02/09/2026) : hydrate chaque page prérendue contre le bundle de CE build ;
      # toute erreur d'hydratation (#418/#423/#425) bloque le commit — et donc la production.
      - name: Vérifier l'hydratation des pages prérendues
        run: node scripts/hydration-check.mjs

      - name: Commit and push if changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/prerendered/ vercel.json public/sitemap.xml
          if git diff --staged --quiet; then
            echo "✅ No changes — pre-rendered pages are up to date"
            # B4 (Lot B, 02/09/2026) : la production ne se déploie plus sur le push source
            # (vercel.json ignoreCommand → scripts/vercel-ignore-build.sh) mais sur le commit du
            # bot. Si le prérendu n'a pas changé après un push src/, le bot pousse un commit
            # VIDE : Vercel construit alors le même arbre que le push, bundle et HTML cohérents.
            # Aucun secret ni Deploy Hook à configurer. Cron et dispatch sans changement : rien.
            if [ "${{ github.event_name }}" = "push" ]; then
              git commit --allow-empty -m "auto-prerender: aucun changement — déploiement production

              Triggered by: ${{ github.event_name }} (commit vide : le push source est ignoré par Vercel, voir scripts/vercel-ignore-build.sh)
              Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
              git push
              echo "🚀 Commit vide poussé — Vercel déploie le bundle du push"
            fi
          else
            BLOG_COUNT=$(ls public/prerendered/blog-*.html 2>/dev/null | wc -l)
            STATIC_COUNT=$(ls public/prerendered/*.html 2>/dev/null | wc -l)
            git commit -m "auto-prerender: ${STATIC_COUNT} pages, ${BLOG_COUNT} blog articles

            Triggered by: ${{ github.event_name }}
            Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            git push
            echo "🚀 Pushed — Vercel will auto-deploy"
          fi

      # Les anciens pings sitemap (google.com/ping, bing.com/ping) sont dépréciés
      # et répondent 404 depuis 2023-2024. Google découvre via le sitemap déclaré
      # dans GSC ; Bing (et les assistants IA qui sourcent sur son index :
      # ChatGPT, Copilot) passent par IndexNow (A4-bis, 04/08/2026).
      - name: Notify Bing/IndexNow with updated URLs
        if: success()
        run: node scripts/indexnow-ping.mjs
