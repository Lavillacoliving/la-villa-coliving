    <!-- Microsoft Clarity — INTÉGRATION TEMPORAIRE (24/08/2026).

              (sections 2d, 3, 4 et 7, en FR ET en EN) ;
           3. la ligne correspondante de ../lavilla-docs/Infrastructure_LaVilla.md section 9 bis.

         Deux gardes volontaires (GO Jérôme du 24/08/2026) :

         1. hostname — scripts/prerender.mjs charge 118 pages sur localhost:3456 à chaque
            `npm run build:local`. Sans ce test, chaque build fabriquerait 118 fausses sessions
            headless qui noieraient les vraies sessions payantes qu'on doit lire. Exclut aussi
            les preview deployments Vercel.

         2. espace résident — /portail, /dashboard, /mon-espace, /reset-password et
            /questionnaire-depart affichent nom, loyer, charges et bail EN CLAIR. Clarity masque
            nativement les SAISIES de formulaire (masquage par défaut CONSERVÉ : ne jamais le
            désactiver, on veut les parcours, jamais les données des candidats), mais PAS le
            texte rendu. Limite assumée de cette version « simple » : le test n'a lieu qu'au

            L'étanchéité complète demanderait clarity("stop") sur changement de route. -->

        if (window.location.hostname !== "www.lavillacoliving.com") return;
        if (/^\/(portail|dashboard|mon-espace|reset-password|questionnaire-depart)(\/|$)/.test(window.location.pathname)) return;

    <!-- Fonts Google en NON-bloquant (R2, checkpoint 21/08/2026). Avant : @import dans
         src/index.css → la feuille Google bloquait le premier rendu (~0,8 s/page en mobile
         simulé, FCP home 4,8 s). Le pattern preload→stylesheet rend les polices dès leur
         arrivée (display=swap), sans bloquer le texte. Même URL qu'avant, même familles. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" />
    </noscript>
