    <!-- Google tag (gtag.js) — GARDE ANALYTICS (Lot C du brief « Formulaire, hydratation, mesure »,
         01/10/2026). Avant : tag statique sans aucune garde → 26 % des événements GA4 depuis juin
         venaient de nos propres outils (prérendu CI et local à 800×600, garde d'hydratation à
         390×844 et 1440×900, nom d'hôte localhost). GA4 est désormais chargé PAR CE SCRIPT, et
         seulement si :
           - le navigateur n'est pas automatisé (navigator.webdriver) ni un robot déclaré (UA) ;
           - le nom d'hôte est celui de la production (www. ou nu) — ni localhost ni previews ;
           - la page n'est pas dans l'espace résident/équipe (même liste que Clarity ci-dessous).
         Trafic interne : ?internal=1 pose localStorage.lvc_internal (?internal=0 le retire), une
         connexion admin au dashboard aussi ; ?test=1 et la session de test lvc_test_session
         comptent aussi → traffic_type: 'internal' (filtre de données GA4) et pas de Clarity.
         ?ga_debug=1 (mémorisé dans l'onglet) force GA4 partout, debug_mode + traffic_type internal :
         seule porte pour DebugView et la capture réseau des vérifications.
         Règles du script : aucun marqueur de commentaire HTML à l'intérieur (scripts/lib/html-comments.mjs
         nettoie tout le <head>, scripts compris), stockages toujours sous try/catch, syntaxe ES5.
         Tests : tools/test/analytics-guard.test.mjs. -->
    <script id="lvc-analytics">
      (function (w, d, n, l) {
        var ID = "G-HW98R11W6M";
        w.dataLayer = w.dataLayer || [];
        w.gtag = function () { w.dataLayer.push(arguments); };
        function qp(k) { var m = new RegExp("[?&]" + k + "=([^&#]*)").exec(l.search); return m ? m[1] : null; }
        function get(s, k) { try { var x = w[s]; return x ? x.getItem(k) : null; } catch (e) { return null; } }
        function put(s, k, v) { try { var x = w[s]; if (x) { if (v === null) x.removeItem(k); else x.setItem(k, v); } } catch (e) {} }
        if (qp("internal") === "1") put("localStorage", "lvc_internal", "1");
        if (qp("internal") === "0") put("localStorage", "lvc_internal", null);
        if (qp("ga_debug") === "1") put("sessionStorage", "lvc_ga_debug", "1");
        if (qp("ga_debug") === "0") put("sessionStorage", "lvc_ga_debug", null);
        var debug = qp("ga_debug") === "1" || get("sessionStorage", "lvc_ga_debug") === "1";
        var bot = n.webdriver === true || /[a-z]bot\/|bot-google|adsbot|mediapartners|storebot|crawler|spider|slurp|headless|lighthouse|inspectiontool|googleother|facebookexternalhit|bingpreview|chatgpt-user|phantomjs/i.test(n.userAgent || "");
        var internal = debug || get("localStorage", "lvc_internal") === "1" || qp("test") === "1" || get("sessionStorage", "lvc_test_session") === "1";
        var prod = /^(www\.)?lavillacoliving\.com$/.test(l.hostname);
        var priv = /^\/(portail|dashboard|mon-espace|reset-password|questionnaire-depart)(\/|$)/.test(l.pathname);
        var ga = debug || (!bot && prod && !priv);
        w.__lvcAnalytics = { ga: ga, internal: internal, bot: bot, debug: debug };
        if (!ga) return;
        var s = d.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=" + ID;
        d.head.appendChild(s);
        w.gtag("js", new Date());
        var c = {};
        if (internal) c.traffic_type = "internal";
        if (debug) c.debug_mode = true;
        w.gtag("config", ID, c);
      })(window, document, navigator, location);
    </script>

    <!-- Microsoft Clarity — INTÉGRATION TEMPORAIRE (24/08/2026).
         Objet : enquête « ~66 clics payants sans conversion depuis le 22/08 » — identifier la
         cause côté atterrissage (rebond immédiat / lecture sans formulaire / formulaire

         Retirer alors :
           1. ce bloc ;

              (sections 2d, 3, 4 et 7, en FR ET en EN) ;
           3. la ligne correspondante de ../lavilla-docs/Infrastructure_LaVilla.md section 9 bis.

         Lot C (01/10/2026) : ni navigateur automatisé ou robot, ni trafic interne (drapeaux lus dans
         window.__lvcAnalytics, posé par le script GA4 ci-dessus).

         Deux gardes volontaires (GO Jérôme du 24/08/2026) :

         1. hostname — scripts/prerender.mjs charge 118 pages sur localhost:3456 à chaque
            `npm run build:local`. Sans ce test, chaque build fabriquerait 118 fausses sessions
            headless qui noieraient les vraies sessions payantes qu'on doit lire. Exclut aussi
            les preview deployments Vercel.

         2. espace résident — /portail, /dashboard, /mon-espace, /reset-password et
            /questionnaire-depart affichent nom, loyer, charges et bail EN CLAIR. Clarity masque
            nativement les SAISIES de formulaire (masquage par défaut CONSERVÉ : ne jamais le
            désactiver, on veut les parcours, jamais les données des candidats), mais PAS le
            texte rendu. Limite assumée de cette version « simple » : le test n'a lieu qu'au
            chargement, donc une navigation SPA depuis / vers /portail reste enregistrée.
            L'étanchéité complète demanderait clarity("stop") sur changement de route. -->
    <script id="lvc-clarity" type="text/javascript">
      (function () {
        var g = window.__lvcAnalytics || {};
        if (g.bot || g.internal) return;
        if (window.location.hostname !== "www.lavillacoliving.com") return;
        if (/^\/(portail|dashboard|mon-espace|reset-password|questionnaire-depart)(\/|$)/.test(window.location.pathname)) return;
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "y7eiydr6dv");
      })();
    </script>

    <!-- Fonts Google en NON-bloquant (R2, checkpoint 21/08/2026). Avant : @import dans
         src/index.css → la feuille Google bloquait le premier rendu (~0,8 s/page en mobile
         simulé, FCP home 4,8 s). Le pattern preload→stylesheet rend les polices dès leur
         arrivée (display=swap), sans bloquer le texte. Même URL qu'avant, même familles. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" />
    </noscript>
