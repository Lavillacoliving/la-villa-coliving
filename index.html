<!doctype html>
<html lang="fr">
  <head>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-HW98R11W6M"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-HW98R11W6M");
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Fonts Google en NON-bloquant (R2, checkpoint 21/08/2026). Avant : @import dans
         src/index.css → la feuille Google bloquait le premier rendu (~0,8 s/page en mobile
         simulé, FCP home 4,8 s). Le pattern preload→stylesheet rend les polices dès leur
         arrivée (display=swap), sans bloquer le texte. Même URL qu'avant, même familles. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" />
    </noscript>

    <title>Colocation &amp; Coliving Premium près de Genève | La Villa Coliving</title>
    <!-- LodgingBusiness schema removed: was duplicating with page-specific schemas on house pages,
         causing "Duplicate field FAQPage" errors in GSC. Organization schema in SEO.tsx covers global needs.
         House-specific LodgingBusiness schemas remain in HouseDetailPage.tsx -->
    <!-- Default meta description (fallback). scripts/inject-prerendered.mjs REPLACES this per-page with
         each route's specific description (from SEO.tsx / React-Helmet). This tag MUST stay present:
         without it the inject "replace" has no target, which silently dropped the description on all
         122 pre-rendered pages. React-Helmet de-dupes by name, so no duplicate tag in the live SPA. -->
    <meta name="description" content="3 maisons à la frontière de Genève — pas une résidence de 300 chambres. Piscine. Sauna. Salle de sport. Chambre privée 17-23 m² tout inclus, 0 frais de dossier." />
    <!-- meta-keywords retiré (A3, 2026-06) : sans valeur SEO. -->
    <!-- Plus de balise preload d'image pour le hero (R2, 21/08/2026) : le <img> du hero
         porte désormais un srcset responsive + fetchpriority="high" dans le HTML prérendu ; un
         preload mono-URL téléchargerait la grande image EN PLUS de la variante choisie (double
         téléchargement), et Vite ré-encode « imagesrcset » (%20 → %2520). Le scanner de
         préchargement du navigateur découvre l'<img> aussi tôt. scripts/inject-prerendered.mjs
         garde sa logique de retrait (no-op sans balise). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
